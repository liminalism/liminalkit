name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features liminalkit/accessibility,liminalkit/bidi -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test with bidi
        run: cargo test -p liminalkit-text --features bidi
      - name: Test with accessibility
        run: cargo test -p liminalkit -p liminalkit-ui --features liminalkit/accessibility,liminalkit-ui/accessibility
      - name: Docs
        run: cargo doc --workspace --no-deps --features liminalkit/accessibility,liminalkit/bidi
      - name: Gallery renders
        run: cargo run -p liminalkit-ui --example gallery -- 2.0
