[package]
name = "liminalkit-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Dependency-free font rendering: TrueType and OpenType parsing, GSUB/GPOS shaping with mark positioning and kerning (Thai included), exact-area anti-aliased glyph rasterization, font fallback, line wrapping and a string cache. The text layer of liminalkit."
keywords = ["truetype", "opentype", "text-shaping", "font", "glyph"]
categories = ["text-processing", "rendering", "graphics"]

[dependencies]
liminalkit-raster = { workspace = true }
# Behind `bidi` only: the Unicode Bidirectional Algorithm and the bracket
# mirroring table. Neither pulls anything else in.
unicode-bidi = { version = "0.3.18", optional = true, default-features = false, features = ["std", "hardcoded-data"] }
unicode-bidi-mirroring = { version = "0.2", optional = true }

[dev-dependencies]
# Path only, so it is dropped on publish. The crate's own unit tests use the
# same files through `font::test_fonts`, under `cfg(test)`.
liminalkit-test-fonts = { workspace = true }

[lints]
workspace = true

[features]
# Reorders mixed-direction lines (UAX #9) and mirrors brackets in
# right-to-left runs. Off by default so the crate stays dependency-free;
# left-to-right output is identical either way.
bidi = ["dep:unicode-bidi", "dep:unicode-bidi-mirroring"]
