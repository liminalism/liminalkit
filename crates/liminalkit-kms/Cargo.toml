[package]
name = "liminalkit-kms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Run a software-rendered GUI full screen on a bare Linux display with no window system: DRM/KMS scan-out, evdev keyboard and multi-touch input, for kiosks, appliances and Raspberry Pi. The embedded host of liminalkit."
keywords = ["drm", "kms", "evdev", "kiosk", "raspberry-pi"]
categories = ["embedded", "os::linux-apis", "hardware-support"]

[dependencies]
liminalkit-raster = { workspace = true }
liminalkit-shell = { workspace = true }
liminalkit-windowing = { workspace = true }

# Already in the graph through `wide`; used here to view a scan-out buffer's
# bytes as pixels, safely (alignment is checked, never assumed).
bytemuck = "1"

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.14"
evdev = "0.13"
rustix = { version = "1", features = ["event"] }

[lints]
workspace = true
