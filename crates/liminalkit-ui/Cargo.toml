[package]
name = "liminalkit-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Immediate-mode GUI controls with caller-owned state and no widget tree: buttons, tabs, forms, text fields, text areas, dropdowns, menus, dialogs, tables, lists, drag and drop, toasts, stateless layout and optional AccessKit accessibility. The controls of liminalkit."
keywords = ["gui", "immediate-mode", "widgets", "ui", "accessibility"]
categories = ["gui", "accessibility"]

[dependencies]
liminalkit-raster = { workspace = true }
liminalkit-text = { workspace = true }
liminalkit-shell = { workspace = true }
accesskit = { version = "0.25", optional = true }
zeroize = { workspace = true }
unicode-segmentation = "1.13.3"

[dev-dependencies]
liminalkit-test-fonts = { workspace = true }

[features]
accessibility = ["dep:accesskit"]

[lints]
workspace = true
