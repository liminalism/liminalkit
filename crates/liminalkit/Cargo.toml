[package]
name = "liminalkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Explicit-state, software-rendered GUI toolkit: caller-owned state, immediate-mode controls, CPU pixel-buffer rendering with no GPU, and one application that runs in a desktop window (winit) or on a bare Linux DRM/KMS display. For utilities, dashboards, kiosks and embedded panels."
keywords = ["gui", "ui", "immediate-mode", "software-rendering", "kiosk"]
categories = ["gui", "rendering", "embedded"]
repository = "https://github.com/liminalism/liminalkit"
readme = "../../README.md"

[dependencies]
liminalkit-raster = { workspace = true }
liminalkit-text = { workspace = true }
liminalkit-shell = { workspace = true }
liminalkit-ui = { workspace = true }
liminalkit-windowing = { workspace = true }
liminalkit-kms = { workspace = true, optional = true }
accesskit = { version = "0.25", optional = true }

[dev-dependencies]
# The Noto fixtures for the examples and tests; path only, dropped on publish.
liminalkit-test-fonts = { workspace = true }

[features]
default = []
# Expose drawn controls to assistive technology through AccessKit.
accessibility = ["liminalkit-ui/accessibility", "liminalkit-windowing/accessibility", "dep:accesskit"]
# The Linux DRM/KMS and evdev host, as `liminalkit::kms`.
kms = ["dep:liminalkit-kms"]
# Unicode bidirectional reordering and bracket mirroring for right-to-left
# text in labels, through the `unicode-bidi` crate.
bidi = ["liminalkit-text/bidi"]

[lints]
workspace = true
