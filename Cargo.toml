[workspace]
resolver = "2"
members = [
    "crates/liminalkit-raster",
    "crates/liminalkit-text",
    "crates/liminalkit-shell",
    "crates/liminalkit-ui",
    "crates/liminalkit-windowing",
    "crates/liminalkit-kms",
    "crates/liminalkit-native",
    "crates/liminalkit-game",
    "crates/liminalkit",
    "crates/liminalkit-test-fonts",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/liminalism/liminalkit"

[workspace.dependencies]
liminalkit-raster = { version = "0.5.0", path = "crates/liminalkit-raster" }
liminalkit-text = { version = "0.5.0", path = "crates/liminalkit-text" }
liminalkit-shell = { version = "0.5.0", path = "crates/liminalkit-shell" }
liminalkit-ui = { version = "0.5.0", path = "crates/liminalkit-ui" }
liminalkit-windowing = { version = "0.5.0", path = "crates/liminalkit-windowing" }
liminalkit-kms = { version = "0.5.0", path = "crates/liminalkit-kms" }
liminalkit-native = { version = "0.5.0", path = "crates/liminalkit-native" }
liminalkit-game = { version = "0.5.0", path = "crates/liminalkit-game" }
# Dev-dependency only, and deliberately without a version: cargo drops a
# path-only dev-dependency when it publishes, so the fonts never ship.
liminalkit-test-fonts = { path = "crates/liminalkit-test-fonts" }
winit = "0.30"
softbuffer = "0.4"
zeroize = "1.8"

# Every crate inherits this except liminalkit-native, whose Windows backend
# needs Win32 calls that have no safe form; it denies unsafe itself and opts
# in for that one Windows-only module (see its Cargo.toml).
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = true

[profile.debug-release]
inherits = "release"
lto = false
debug = 1

[profile.release-final]
inherits = "release"
lto = "thin"
codegen-units = 1
