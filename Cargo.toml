[workspace]
resolver = "2"
members = [
    "crates/liminalkit-raster",
    "crates/liminalkit-text",
    "crates/liminalkit-shell",
    "crates/liminalkit-ui",
    "crates/liminalkit-windowing",
    "crates/liminalkit-kms",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
liminalkit-raster = { path = "crates/liminalkit-raster" }
liminalkit-text = { path = "crates/liminalkit-text" }
liminalkit-shell = { path = "crates/liminalkit-shell" }
liminalkit-ui = { path = "crates/liminalkit-ui" }
liminalkit-windowing = { path = "crates/liminalkit-windowing" }
liminalkit-kms = { path = "crates/liminalkit-kms" }
winit = "0.30"
softbuffer = "0.4"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = true

[profile.debug-release]
inherits = "release"
lto = false
debug = 1

[profile.release-final]
inherits = "release"
lto = "thin"
codegen-units = 1
